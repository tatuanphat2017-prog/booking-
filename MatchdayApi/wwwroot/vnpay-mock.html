<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Mô phỏng thanh toán VNPay (Demo) — MatchdayApi</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background: #0A0C10; color: #F4F6FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; }
  .card { background: #12151b; border: 1px solid #23272f; border-radius: 12px; padding: 32px 36px; max-width: 440px; width: 100%; }
  .badge { display: inline-block; background: #c98a2b; color: #0A0C10; font-weight: 600; font-size: 11px; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .hint { color: #9aa4b2; font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #23272f; font-size: 14px; }
  .row span:first-child { color: #9aa4b2; }
  .amount { color: #5B9CFF; font-weight: 600; }
  .actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  button { border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  #ok { background: #2ECC71; color: #06210f; }
  #ok:hover { background: #4ee08a; }
  #fail { background: #E74C3C; color: #2b0906; }
  #fail:hover { background: #ef7060; }
  #err { color: #E74C3C; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">CHẾ ĐỘ GIẢ LẬP — KHÔNG PHẢI VNPAY THẬT</span>
    <h1>Mô phỏng cổng thanh toán</h1>
    <p class="hint">Trang này chỉ giả lập lại kết quả VNPay trả về, dùng để test luồng đặt vé khi chưa có tài khoản VNPay sandbox thật. Bấm 1 trong 2 nút bên dưới để giả lập kết quả.</p>

    <div class="row"><span>Mã giao dịch</span><span id="txnRef">-</span></div>
    <div class="row"><span>Nội dung</span><span id="orderInfo">-</span></div>
    <div class="row"><span>Số tiền</span><span class="amount" id="amount">-</span></div>

    <div class="actions">
      <button id="ok" onclick="respond(true)">✅ Giả lập thanh toán THÀNH CÔNG</button>
      <button id="fail" onclick="respond(false)">❌ Giả lập thanh toán THẤT BẠI / Hủy</button>
    </div>
    <div id="err"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const txnRef = params.get('txnRef') || '';
  const amount = params.get('amount') || '0';
  const orderInfo = params.get('orderInfo') || '';
  const returnUrl = params.get('returnUrl') || '';

  if (!txnRef || !returnUrl) {
    document.getElementById('err').textContent = 'Thiếu tham số (txnRef/returnUrl) — trang này phải được mở qua link do API /api/Payments/vnpay/create/{id} trả về, không mở trực tiếp.';
    document.getElementById('ok').disabled = true;
    document.getElementById('fail').disabled = true;
  } else {
    document.getElementById('txnRef').textContent = txnRef;
    document.getElementById('orderInfo').textContent = orderInfo;
    document.getElementById('amount').textContent = Number(amount).toLocaleString('vi-VN') + 'đ';
  }

  function respond(success) {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const payDate = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

    const result = new URLSearchParams();
    result.set('vnp_TxnRef', txnRef);
    result.set('vnp_Amount', amount);
    result.set('vnp_OrderInfo', orderInfo);
    result.set('vnp_BankCode', 'MOCKBANK');
    result.set('vnp_PayDate', payDate);
    result.set('vnp_ResponseCode', success ? '00' : '24');
    result.set('vnp_TransactionStatus', success ? '00' : '02');
    result.set('vnp_TransactionNo', 'MOCK' + now.getTime());
    result.set('vnp_SecureHash', 'MOCK'); // chế độ giả lập: không có chữ ký thật

    const sep = returnUrl.includes('?') ? '&' : '?';
    window.location.href = returnUrl + sep + result.toString();
  }
</script>
</body>
</html>

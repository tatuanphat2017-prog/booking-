<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mô phỏng thanh toán VNPay (Demo) — MatchdayApi</title>
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .pay-card { max-width: 440px; width: 100%; padding: 32px 34px; }
  .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .row span:first-child { color: var(--text-muted); }
  .amount { color: var(--gold-bright); font-weight: 600; font-family: var(--font-mono); }
  .actions { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  #err { color: var(--danger-bright); font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>

  <div class="card pay-card fade-in">
    <span class="badge badge-upcoming mb-16" style="display:inline-flex;">Chế độ giả lập — không phải VNPay thật</span>
    <h1 style="font-size:20px; margin: 14px 0 6px;">Mô phỏng cổng thanh toán</h1>
    <p class="text-muted text-sm">Trang này chỉ giả lập lại kết quả VNPay trả về, dùng để test luồng đặt vé khi chưa có tài khoản VNPay sandbox thật. Bấm 1 trong 2 nút bên dưới để giả lập kết quả.</p>

    <div class="row"><span>Mã giao dịch</span><span class="mono" id="txnRef">-</span></div>
    <div class="row"><span>Nội dung</span><span id="orderInfo">-</span></div>
    <div class="row"><span>Số tiền</span><span class="amount" id="amount">-</span></div>

    <div class="actions">
      <button class="btn btn-gold" id="ok" onclick="respond(true)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 8.4 6 11.6l7.2-7.2"/></svg> Giả lập thanh toán thành công</button>
      <button class="btn btn-danger" id="fail" onclick="respond(false)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg> Giả lập thanh toán thất bại / hủy</button>
    </div>
    <div id="err"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const txnRef = params.get('txnRef') || '';
  const amount = params.get('amount') || '0';
  const orderInfo = params.get('orderInfo') || '';
  const returnUrl = params.get('returnUrl') || '';

  if (!txnRef || !returnUrl) {
    document.getElementById('err').textContent = 'Thiếu tham số (txnRef/returnUrl) — trang này phải được mở qua link do API /api/Payments/vnpay/create/{id} trả về, không mở trực tiếp.';
    document.getElementById('ok').disabled = true;
    document.getElementById('fail').disabled = true;
  } else {
    document.getElementById('txnRef').textContent = txnRef;
    document.getElementById('orderInfo').textContent = orderInfo;
    document.getElementById('amount').textContent = Number(amount).toLocaleString('vi-VN') + 'đ';
  }

  function respond(success) {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const payDate = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

    const result = new URLSearchParams();
    result.set('vnp_TxnRef', txnRef);
    result.set('vnp_Amount', amount);
    result.set('vnp_OrderInfo', orderInfo);
    result.set('vnp_BankCode', 'MOCKBANK');
    result.set('vnp_PayDate', payDate);
    result.set('vnp_ResponseCode', success ? '00' : '24');
    result.set('vnp_TransactionStatus', success ? '00' : '02');
    result.set('vnp_TransactionNo', 'MOCK' + now.getTime());
    result.set('vnp_SecureHash', 'MOCK'); // chế độ giả lập: không có chữ ký thật

    const sep = returnUrl.includes('?') ? '&' : '?';
    window.location.href = returnUrl + sep + result.toString();
  }
</script>
</body>
</html>
